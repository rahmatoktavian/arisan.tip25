name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install deps
        run: npm ci

      # Opsional: jika ada linter/test di package.json, aktifkan baris di bawah
      # - run: npm run lint --if-present
      # - run: npm test --if-present

      - name: Build
        run: npm run build --if-present

      - name: Upload build artifact (jaga-jaga)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: |
            dist
            build
          if-no-files-found: ignore
